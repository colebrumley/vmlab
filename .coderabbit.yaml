# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reads a pull request when `node scripts/review.mjs` asks it to (scripts/review.mjs), at most
# twice, and never on its own after a push: the open-source allowance is a few reviews an hour for
# the whole repository. It approves or requests changes, and the worker reads its comments together
# with the Codex findings.
language: en-US
tone_instructions: >-
  Report only defects you can tie to a concrete input or state. Skip style, naming and formatting.
reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_labels: false
  auto_review:
    enabled: false
    auto_incremental_review: false
