name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Unit tests only: hosted runners cannot run VMs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode-select -p
          swift --version
          sw_vers
          for t in qemu-img qemu-system-aarch64 tart ruby perl hdiutil codesign; do printf '%s: ' "$t"; command -v "$t" || echo missing; done
      - run: scripts/check.sh
